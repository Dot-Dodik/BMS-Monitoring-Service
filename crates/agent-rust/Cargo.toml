[package]
name = "agent-rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "cmk-agent"
path = "src/main.rs"

[features]
default = []
branch-proxy = ["dep:tokio"]

[dependencies]
monitoring-proto = { path = "../monitoring-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
tokio = { version = "1.40", features = ["rt", "macros", "time", "process", "net"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

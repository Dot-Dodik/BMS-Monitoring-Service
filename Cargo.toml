[workspace]
resolver = "2"
members = [
    "crates/monitoring-proto",
    "crates/agent-rust",
    "crates/server-rust",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["IT OPS Enterprise Monitoring"]
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
